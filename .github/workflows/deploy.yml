name: Deploy SEO site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
  schedule:
    # Раз в сутки в 04:00 UTC (10:00 Алматы) — пересобираем чтобы курс USD освежился
    - cron: '0 4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        # npm bug #4828: lock сгенерён на macOS не содержит Linux-binary rollup.
        # Workaround: rm lock + npm install для пересборки на текущей платформе.
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund

      - name: Build Astro site
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PLASMIC_PROJECT_ID: ${{ secrets.PLASMIC_PROJECT_ID }}
          PLASMIC_API_TOKEN: ${{ secrets.PLASMIC_API_TOKEN }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Optional: local Postgres for offline Django development.
# Production/staging use the existing Supabase Postgres via backend/.env DATABASE_URL.
# Start:  docker compose up -d
# Then point backend/.env DATABASE_URL at:
#   postgresql://myavto:myavto@localhost:5433/myavto
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: myavto
      POSTGRES_PASSWORD: myavto
      POSTGRES_DB: myavto
    ports:
      - "5433:5432"   # 5433 host -> avoid clashing with a local 5432
    volumes:
      - myavto_pgdata:/var/lib/postgresql/data

volumes:
  myavto_pgdata:
